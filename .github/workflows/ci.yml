# Lint, test and format-check on every push, on the maintainer's self-hosted runner (label "wowforever").
# No GitHub-hosted runner here: tools/ci/check-runners.sh in the scaffolding repo fails if one appears.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Fork PRs never run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, wowforever]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: luacheck
        run: luacheck . --no-color
      - name: busted
        run: busted --verbose
      - name: stylua
        run: stylua --check .
      # The data tools (tools/gen_recipes.py, import_wowhead.py, update_data.py, import_savedvars.py, luatable.py):
      # standard library only, and no network (the tests replace the download). The coverage of the committed
      # Data/Recipes.lua is checked by busted (tests/coverage_spec.lua): gen_recipes.py --check needs the client
      # tables, which are not in the repo. The daily refresh itself is data-update.yml.
      - name: python tools
        run: python3 -m unittest discover -s tools/tests -v
