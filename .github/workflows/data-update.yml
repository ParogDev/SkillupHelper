# Once a day: ask wago.tools for the newest WoW: Forever build and regenerate the shipped data from it
# (tools/update_data.py). When the data changed, the regenerated files go to one fixed branch and one pull request
# whose body is the change report; a person reads and merges it (nothing here merges). When a coverage hole
# appeared or an input broke, the job fails with the report in its summary. docs/data-sources.md has the long
# version. Runs on the maintainer's self-hosted runner, like ci.yml (no GitHub-hosted runner in this repo).
#
# A pull request opened with GITHUB_TOKEN does not start other workflows, so ci.yml never runs on it. The same
# checks therefore run here, on the regenerated files, before the pull request is opened.
# Needs, once, in the repository settings: Actions > General > "Allow GitHub Actions to create and approve pull
# requests".
name: data-update

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-update
  cancel-in-progress: false

env:
  BRANCH: auto/data-update
  # What update_data.py may rewrite without the cmangos dump. Data/Spots.lua and Data/Trainers.lua need the dump and
  # are regenerated by a person (docs/data-sources.md).
  DATA_FILES: Data/Recipes.lua tools/data/client_snapshot.json

jobs:
  update:
    runs-on: [self-hosted, wowforever]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: tools on the runner
        run: |
          for tool in python3 git gh luacheck busted stylua; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on the runner: data-update needs it"; exit 1; }
          done
      - name: update the data
        id: update
        run: |
          set +e
          python3 tools/update_data.py --report "$RUNNER_TEMP/data-report.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/data-report.md" ]; then
            head -c 900000 "$RUNNER_TEMP/data-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "update_data.py wrote no report (exit code $code)." >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$code" in
            0) echo "No change." ;;
            10) echo "Data changed." ;;
            *)
              echo "::error::update_data.py exit $code: a coverage hole appeared or an input broke. The report is in the job summary."
              exit 1
              ;;
          esac
      # The checks of ci.yml, on the regenerated files (ci.yml does not run on this workflow's pull request).
      - name: luacheck
        if: steps.update.outputs.code == '10'
        run: luacheck . --no-color
      - name: busted
        if: steps.update.outputs.code == '10'
        run: busted --verbose
      - name: stylua
        if: steps.update.outputs.code == '10'
        run: stylua --check .
      - name: python tools
        if: steps.update.outputs.code == '10'
        run: python3 -m unittest discover -s tools/tests -v
      - name: open or update the pull request
        if: steps.update.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          # shellcheck disable=SC2086  # DATA_FILES is a list of paths without spaces
          git add -- $DATA_FILES
          if git diff --cached --quiet; then
            echo "::error::update_data.py reported a change, and none of $DATA_FILES differs: the file list in this workflow is out of date"
            exit 1
          fi
          git switch -C "$BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Data: regenerate from the newest WoW: Forever build"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          # The token reaches git through gh's credential helper for these commands only: it is never in a URL, a
          # command line or the runner's git config (the checkout above keeps no credentials).
          authed() { git -c credential.helper= -c credential.helper='!gh auth git-credential' "$@"; }
          # One fixed branch, replaced each time, so there is never a second pull request. Not pushed again when the
          # branch already holds exactly these files (a day with nothing new since the last run).
          if authed fetch --quiet "$remote" "refs/heads/$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "The branch $BRANCH already holds this data."
          else
            authed push --force "$remote" "HEAD:refs/heads/$BRANCH"
          fi
          {
            head -c 60000 "$RUNNER_TEMP/data-report.md"
            printf '\n\n---\nOpened by the data-update workflow (tools/update_data.py). luacheck, busted, stylua and the Python tool tests ran in that workflow on these files, because ci.yml does not run on a pull request opened with GITHUB_TOKEN. To get the ci check on this pull request too, close and reopen it. Never merged automatically.\n'
          } > "$RUNNER_TEMP/pr-body.md"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated pull request #$number."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" \
              --title "Data: update from the game's newest build" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
